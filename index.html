    <!-- Runs before first paint: flags slower devices ("lite" = lighter effects) and keeps the hero
         intro paused until the loading screen leaves. -->
    <script>
      (function (w, d) {
        var h = d.documentElement, n = w.navigator, c = n.connection || {};
        var reduced = w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced || c.saveData || /2g/.test(c.effectiveType || '') ||
            (n.deviceMemory && n.deviceMemory <= 4) ||
            (n.hardwareConcurrency && n.hardwareConcurrency <= 4)) h.classList.add('lite');
        h.classList.add('is-loading');

        // Lifts the loading screen once the font is ready (capped, so a slow font never holds the
        // page) and the wordmark has had a moment on screen. Safe to call more than once.
        w.__plDismiss = function () {
          if (w.__plStarted) return;
          w.__plStarted = true;
          var el = d.getElementById('preloader'), fontOk = false, minOk = false, gone = false;
          var finish = function () { h.classList.remove('is-loading'); };
          if (!el) return finish();
          var go = function () {
            if (gone || !fontOk || !minOk) return;
            gone = true;
            w.requestAnimationFrame(function () {
              el.classList.add('is-done');
              w.__plDone = true;
              w.dispatchEvent(new Event('pl:done'));
              w.setTimeout(finish, 200);
              w.setTimeout(function () { el.remove(); }, 900);
            });
          };
          var fontDone = function () { fontOk = true; go(); };
          var loadInter = function () {
            if (!d.fonts || !d.fonts.load) return fontDone();
            d.fonts.load('700 1em Inter').then(fontDone, fontDone);
          };
          w.setTimeout(function () { minOk = true; go(); }, Math.max(0, 500 - w.performance.now()));
          w.setTimeout(fontDone, 1200);
          loadInter();
        };
        // Failsafe: never keep the loading screen up if the app script fails to start.
        w.setTimeout(function () {
          h.classList.remove('is-loading');
          var p = d.getElementById('preloader');
          if (p) p.remove();
        }, 7000);
      })(window, document);
    </script>

    <!-- Loading screen styles: inline so it paints on the very first frame. Transform/opacity only. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        background: #fff;
        color: #000;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: transform 0.75s cubic-bezier(0.76, 0, 0.24, 1) 0.12s;
        animation: pl-failsafe 0.01s linear 7s forwards;
      }
      .pl-inner {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        width: max-content;
        transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .pl-mask { overflow: hidden; padding: 0 2px; }
      .pl-word {
        display: block;
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.06em;
        text-transform: uppercase;
        transform: translateY(105%);
        animation: pl-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      .pl-bar {
        position: relative;
        height: 1px;
        background: rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .pl-bar i {
        position: absolute;
        inset: 0;
        background: #000;
        transform: scaleX(0);
        transform-origin: 0 50%;
        animation: pl-load 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }
      .pl-meta {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.45);
        opacity: 0;
        animation: pl-fade 0.6s ease 0.25s forwards;
      }
      /* Ready: the bar completes, the content lifts away, then the white panel slides up. */
      #preloader.is-done { transform: translateY(-100%); pointer-events: none; }
      #preloader.is-done .pl-bar i { transform: scaleX(1); animation: none; transition: transform 0.25s ease-out; }
      #preloader.is-done .pl-inner { opacity: 0; transform: translateY(-14px); transition-delay: 0.1s; }
      @keyframes pl-rise { to { transform: translateY(0); } }
      @keyframes pl-fade { to { opacity: 1; } }
      @keyframes pl-load { 0% { transform: scaleX(0); } 60% { transform: scaleX(0.7); } 100% { transform: scaleX(0.9); } }
      @keyframes pl-failsafe { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #preloader, .pl-inner { transition: opacity 0.3s ease; }
        #preloader.is-done { transform: none; opacity: 0; }
        .pl-word, .pl-meta { animation: none; transform: none; opacity: 1; }
      }
    </style>
